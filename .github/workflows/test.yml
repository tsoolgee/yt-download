name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: מיזוג (מאומת ב-ffprobe)
        run: node test/mux.test.js
      - name: התאוששות מחיתוכי רשת
        run: node test/fetch.test.js
      - name: הבנייה עוברת
        run: python build.py
